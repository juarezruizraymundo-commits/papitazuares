<!DOCTYPE html>
<html lang="es">
<head>
    <title>Promedio de Calificación</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>SUMA DE DOS NUMEROS</h1>

    <label>Promedio 1:</label>
    <input type="number" id="Promedio1">
    <br><br>

    <label>Promedio 2:</label>
    <input type="number" id="Promedio2">
    <br><br>

    <label>Promedio 3:</label>
    <input type="number" id="Promedio3">
    <br><br>

    <label>Promedio 4:</label>
    <input type="number" id="Promedio4">
    <br><br>

    <label>Promedio 5:</label>
    <input type="number" id="Promedio5">
    <br><br>

    <button onclick="promedio()">promedio</button>

    <h2 id="total"></h2>

    <script>
        function promedio() {
            let Promedio1 = Number(document.getElementById("Promedio1").value);
            let Promedio2 = Number(document.getElementById("Promedio2").value);
            let Promedio3 = Number(document.getElementById("Promedio3").value);
            let Promedio4 = Number(document.getElementById("Promedio4").value);
            let Promedio5 = Number(document.getElementById("Promedio5").value);

            let suma = Promedio1 + Promedio2 + Promedio3 + Promedio4 + Promedio5;
            let resultado = suma / 5;

            document.getElementById("total").innerHTML =
                "La suma es: " + suma +
                "<br>El promedio es: " + resultado;
        }
    </script>

</body>
</html>
